spring.application.name=cuidado-app

spring.datasource.url=${DB_URL:jdbc:h2:file:./data/cooperativadb;DB_CLOSE_DELAY=-1;MODE=MySQL}
spring.datasource.username=${DB_USERNAME:sa}
spring.datasource.password=${DB_PASSWORD:}

server.servlet.encoding.charset=UTF-8
server.servlet.encoding.enabled=true
server.servlet.encoding.force-request=true
server.servlet.session.tracking-modes=cookie
spring.thymeleaf.encoding=UTF-8
spring.thymeleaf.cache=false
spring.web.resources.cache.period=0

spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=${JPA_SHOW_SQL:false}
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=50MB
spring.servlet.multipart.resolve-lazily=true

# Carpeta donde se guardan los legajos: <directorio>/socios/<id> y <directorio>/clientes/<id>
app.legajos.directorio=${LEGAJOS_DIR:legajos}
app.cuentas.demo=${APP_CUENTAS_DEMO:true}
app.cuentas.admin.username=${APP_ADMIN_USERNAME:admin}
app.cuentas.admin.password=${APP_ADMIN_PASSWORD:admin123}
app.cuentas.admin.nombre=${APP_ADMIN_NOMBRE:Laura}
app.cuentas.admin.apellido=${APP_ADMIN_APELLIDO:Administradora}

spring.mail.test-connection=false
