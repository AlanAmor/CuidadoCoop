<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Iniciar sesión | CuidadoCoop</title>
    <link rel="stylesheet" th:href="@{/css/app.css(v=3)}">
</head>
<body class="login-body">
<main class="login-wrapper">
    <section class="content-card form-card login-card">
        <div class="login-brand">
            <span class="brand">Cuidado<span>Coop</span></span>
            <p class="eyebrow">ACCESO AL SISTEMA</p>
            <h1>Iniciar sesión</h1>
            <p class="muted">Ingresá con tu usuario y contraseña para continuar.</p>
        </div>

        <div class="alert alert-success" th:if="${param.salio}" role="status">
            Cerraste sesión correctamente.
        </div>
        <div class="alert alert-error" th:if="${errorLogin}" th:text="${errorLogin}" role="alert"></div>

        <form method="post" th:action="@{/login}">
            <div class="field">
                <label for="username">Usuario</label>
                <input id="username" name="username" type="text" required autofocus
                       th:value="${usernameIngresado}" autocomplete="username" placeholder="Ej.: admin">
            </div>
            <div class="field field-spaced">
                <label for="password">Contraseña</label>
                <input id="password" name="password" type="password" required
                       autocomplete="current-password" placeholder="••••••••">
            </div>
            <div class="form-actions login-actions">
                <button class="button button-primary login-submit" type="submit">Ingresar</button>
            </div>
        </form>
    </section>
</main>
</body>
</html>
