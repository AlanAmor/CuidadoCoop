<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Tipos de servicio | CuidadoCoop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="container">
    <section class="page-heading">
        <div>
            <p class="eyebrow">GESTIÓN</p>
            <h1>Tipos de servicio</h1>
            <p class="muted">Creá, renombrá o eliminá las categorías que usás al definir servicios (por ejemplo "Acompañamiento" o "Kinesiología").</p>
        </div>
        <a class="button button-secondary" th:href="@{/servicios}">Volver a servicios</a>
    </section>
    <div class="alert alert-success" th:if="${mensajeExito}" th:text="${mensajeExito}" role="status"></div>
    <div class="alert alert-error" th:if="${errorOperacion}" th:text="${errorOperacion}" role="alert"></div>

    <form class="content-card form-card tipo-nuevo" method="post" th:action="@{/tipos-servicio}">
        <div class="field">
            <label for="nombreNuevo">Nuevo tipo de servicio</label>
            <input id="nombreNuevo" name="nombre" type="text" maxlength="60" required placeholder="Ej.: Acompañamiento">
        </div>
        <button class="button button-primary" type="submit">Agregar</button>
    </form>

    <div class="content-card table-card">
        <div class="table-wrap">
            <table>
                <thead>
                <tr><th>Nombre</th><th>Servicios que lo usan</th><th>Acciones</th></tr>
                </thead>
                <tbody>
                <tr th:each="tipo : ${tipos}">
                    <td>
                        <form class="tipo-renombrar" method="post" th:action="@{/tipos-servicio/{id}(id=${tipo.id})}">
                            <input type="text" name="nombre" maxlength="60" required
                                   th:value="${tipo.nombre}" th:aria-label="|Nombre del tipo ${tipo.nombre}|">
                            <button class="button button-secondary" type="submit">Guardar nombre</button>
                        </form>
                    </td>
                    <td th:text="${usos[tipo.id]}">0</td>
                    <td class="row-actions">
                        <form method="post" th:action="@{/tipos-servicio/{id}/eliminar(id=${tipo.id})}"
                              data-confirm="¿Eliminar este tipo de servicio?">
                            <button class="button button-danger" type="submit"
                                    th:disabled="${usos[tipo.id] > 0}"
                                    th:title="${usos[tipo.id] > 0} ? 'No se puede eliminar mientras lo use algún servicio' : null">Eliminar</button>
                        </form>
                    </td>
                </tr>
                <tr th:if="${#lists.isEmpty(tipos)}">
                    <td colspan="3" class="empty-state">Todavía no hay tipos. Agregá el primero arriba.</td>
                </tr>
                </tbody>
            </table>
        </div>
    </div>
</main>
</body>
</html>
