<!DOCTYPE html>
<html lang="es" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Cliente | CuidadoCoop</title>
    <link rel="stylesheet" th:href="@{/css/app.css}">
</head>
<body>
<div th:replace="~{fragments/layout :: header}"></div>
<main class="container narrow-container">
    <section class="page-heading">
        <div>
            <p class="eyebrow">CLIENTES</p>
            <h1 th:text="${titulo}">Cliente</h1>
        </div>
    </section>
    <div class="alert alert-error" th:if="${errorOperacion}" th:text="${errorOperacion}" role="alert"></div>
    <form class="content-card form-card" method="post" th:action="${accion}" th:object="${cliente}">
        <div class="form-grid">
            <div class="field">
                <label for="nombrePaciente">Nombre del paciente</label>
                <input id="nombrePaciente" type="text" th:field="*{nombrePaciente}" placeholder="Ej: GARCIA Susana">
                <small class="field-error" th:errors="*{nombrePaciente}"></small>
            </div>
            <div class="field">
                <label for="dniPaciente">DNI del paciente</label>
                <input id="dniPaciente" type="text" th:field="*{dniPaciente}" maxlength="20" placeholder="Ej: 14500123">
                <small class="field-error" th:errors="*{dniPaciente}"></small>
            </div>
        </div>
        <div class="form-grid field-spaced">
            <div class="field">
                <label for="nombreFamiliar">Nombre del familiar responsable</label>
                <input id="nombreFamiliar" type="text" th:field="*{nombreFamiliar}">
                <small class="field-error" th:errors="*{nombreFamiliar}"></small>
            </div>
            <div class="field">
                <label for="telefono">Teléfono de contacto</label>
                <input id="telefono" type="text" th:field="*{telefono}">
                <small class="field-error" th:errors="*{telefono}"></small>
            </div>
            <div class="field">
                <label for="correo">Correo electrónico</label>
                <input id="correo" type="email" th:field="*{correo}">
                <small class="field-error" th:errors="*{correo}"></small>
            </div>
        </div>
        <div class="field field-spaced">
            <label for="domicilio">Dirección / Domicilio del servicio</label>
            <input id="domicilio" type="text" th:field="*{domicilio}" placeholder="Ej: Sargento Cabral 1234">
            <small class="field-error" th:errors="*{domicilio}"></small>
        </div>
        <div class="form-grid field-spaced">
            <div class="field">
                <label for="ciudad">Ciudad</label>
                <input id="ciudad" type="text" th:field="*{ciudad}" placeholder="Ej: Santa Fé">
                <small class="field-error" th:errors="*{ciudad}"></small>
            </div>
            <div class="field">
                <label for="localidad">Localidad / Provincia</label>
                <input id="localidad" type="text" th:field="*{localidad}" placeholder="Ej: Santa Fé">
                <small class="field-error" th:errors="*{localidad}"></small>
            </div>
            <div class="field">
                <label for="codigoPostal">Código postal (CP)</label>
                <input id="codigoPostal" type="text" th:field="*{codigoPostal}" maxlength="20" placeholder="Ej: 3000">
                <small class="field-error" th:errors="*{codigoPostal}"></small>
            </div>
        </div>
        <div class="field field-spaced">
            <label for="observacionMedica">Observación médica (opcional)</label>
            <textarea id="observacionMedica" rows="3" th:field="*{observacionMedica}"></textarea>
            <small class="field-error" th:errors="*{observacionMedica}"></small>
        </div>
        <div class="form-actions">
            <button class="button button-primary" type="submit">Guardar</button>
            <a class="button button-secondary" th:href="@{/clientes}">Cancelar</a>
        </div>
    </form>
    <section th:replace="~{fragments/layout :: panelLegajo}"></section>
</main>
</body>
</html>
